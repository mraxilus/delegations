<!--
  Comparison panel, appended to page by `tools/build.nim mockup` alone.
  Reads comparison from bridge (`nimMockupSpec`), so holds no option and no scenario of its own:
  `src/browser/mockup.nim` holds them. See README, Comparison mockups.
  Plain script rather than TypeScript: page's type-checked scripts never see mockup.
-->
<style>
  .mockup {
    position: fixed;
    top: calc(max(14px, env(safe-area-inset-top)) + 58px);
    left: max(14px, env(safe-area-inset-left));
    z-index: 7;
    width: min(340px, calc(100vw - 28px));
    max-height: calc(100vh - 140px);
    overflow-y: auto;
    box-sizing: border-box;
    display: grid;
    gap: 8px;
    padding: 10px 12px;
    font-family: var(--sans);
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .mockup-head {
    appearance: none; border: 0; background: none; padding: 0; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font: 600 12px/1.3 var(--sans); letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink-muted); text-align: left;
  }
  .mockup-live { font: 11.5px/1.4 var(--mono); color: var(--accent-ink); min-height: 1.4em; }
  .mockup-body { display: grid; gap: 8px; }
  .mockup-body[hidden] { display: none; }
  .mockup-question { margin: 0; color: var(--ink-muted); }
  .mockup-label {
    font: 600 10.5px/1.2 var(--sans); letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  .mockup-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(44px, 1fr)); gap: 4px;
  }
  .mockup-pick {
    appearance: none; cursor: pointer; min-height: 40px; padding: 4px 6px;
    font: 600 12px/1.2 var(--sans); color: var(--ink-muted);
    background: var(--surface-solid); border: 1px solid var(--border); border-radius: 8px;
  }
  .mockup-pick.is-key { font: 600 15px/1 var(--mono); }
  .mockup-pick[aria-pressed="true"] { color: var(--accent-ink); border-color: var(--accent); }
  .mockup-go {
    appearance: none; cursor: pointer; min-height: 40px;
    font: 600 13px/1 var(--sans); color: var(--bg);
    background: var(--accent); border: 1px solid var(--accent); border-radius: 8px;
  }
  .mockup-head:focus-visible, .mockup-pick:focus-visible, .mockup-go:focus-visible {
    outline: 2px solid var(--accent-ink); outline-offset: 2px;
  }
  .mockup-text { color: var(--ink-muted); }
  .mockup-text b { color: var(--ink); }
  .mockup-steps { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
  .mockup-watch { color: var(--ink); }
  .mockup-error { color: var(--danger); }
  .mockup-table-wrap { overflow-x: auto; }
  .mockup-table {
    border-collapse: collapse; width: 100%; font-size: 11px; table-layout: fixed;
  }
  .mockup-table th:first-child { width: 34%; }
  .mockup-table th, .mockup-table td {
    border-top: 1px solid var(--border); padding: 3px 4px; text-align: left;
    vertical-align: top;
  }
  .mockup-table th { color: var(--ink-faint); font-weight: 600; }
  .mockup-table td small { display: block; font-family: var(--mono); color: var(--ink-faint); }
  .mockup-verdict-asked, .mockup-verdict-returned { color: var(--accent-ink); }
  .mockup-verdict-flung, .mockup-verdict-off { color: var(--danger); }
  .mockup-verdict-short, .mockup-verdict-over { color: var(--ink); }
  .mockup-how { margin: 4px 0 0; padding-left: 18px; color: var(--ink-muted); }
  .mockup-read {
    font: 10.5px/1.45 var(--mono); color: var(--ink-faint);
    font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
  }
  .mockup-ring {
    position: fixed; z-index: 6; pointer-events: none;
    width: 30px; height: 30px; margin: -16px 0 0 -16px;
    border: 2px solid var(--accent); border-radius: 999px;
    box-shadow: 0 0 0 1px var(--bg), inset 0 0 0 1px var(--bg);
  }
  .mockup-ring::before, .mockup-ring::after {
    content: ""; position: absolute; background: var(--accent);
  }
  .mockup-ring::before { left: 14px; top: 6px; width: 2px; height: 18px; }
  .mockup-ring::after { top: 14px; left: 6px; height: 2px; width: 18px; }
  .mockup-ring span {
    position: absolute; top: 34px; left: 50%; transform: translateX(-50%);
    white-space: nowrap; font: 600 10.5px/1 var(--sans); color: var(--accent-ink);
    text-shadow: 0 1px 2px var(--bg);
  }
</style>
<section class="mockup" id="mockup" aria-label="Comparison mockup">
  <button class="mockup-head" id="mockup-head" type="button" aria-expanded="true">
    <span id="mockup-title">Comparison</span>
    <span id="mockup-caret" aria-hidden="true">&#9662;</span>
  </button>
  <div class="mockup-live" id="mockup-live" aria-live="polite"></div>
  <div class="mockup-body" id="mockup-body">
    <p class="mockup-question" id="mockup-question"></p>
    <div class="mockup-label">Scenario <span id="mockup-scenario-name"></span></div>
    <div class="mockup-row" id="mockup-scenarios" role="group" aria-label="Scenario"></div>
    <div class="mockup-label">Option</div>
    <div class="mockup-row" id="mockup-options" role="group" aria-label="Option"></div>
    <div class="mockup-text">
      <b id="mockup-option-name"></b> <span id="mockup-option-text"></span>
    </div>
    <button class="mockup-go" id="mockup-go" type="button">Set up</button>
    <div class="mockup-label">Steps</div>
    <ol class="mockup-steps" id="mockup-steps"></ol>
    <div class="mockup-watch" id="mockup-watch"></div>
    <div class="mockup-label">Results</div>
    <div class="mockup-table-wrap"><table class="mockup-table" id="mockup-table"></table></div>
    <details>
      <summary class="mockup-label">How to compare</summary>
      <ol class="mockup-how" id="mockup-how"></ol>
    </details>
    <div class="mockup-read" id="mockup-read"></div>
  </div>
</section>
<div id="mockup-rings"></div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const VERDICTS = {
    waiting: 'waiting', asked: 'as asked', short: 'short', over: 'over', flung: 'flung',
    returned: 'returned', off: 'off',
  };
  const DOT = ' · ';
  const TIMES = '×';
  const state = { spec: null, option: '', scenario: 0, active: null, results: {} };

  function load(key, fallback) {
    try {
      const value = localStorage.getItem('mockup-' + key);
      return value === null ? fallback : JSON.parse(value);
    } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem('mockup-' + key, JSON.stringify(value)); } catch (e) {}
  }
  const figure = (x) => (x !== 0 && Math.abs(x) < 1e-3) ? x.toExponential(1)
    : Number(x.toPrecision(4)).toLocaleString('en', { maximumSignificantDigits: 4 });
  const canvas = () => document.querySelector('canvas');
  function focusView() {
    const c = canvas();
    if (c) c.focus({ preventScroll: true });
  }

  // Zoom's share of what steps asked, on log scale: 1 as asked, 0 nothing.
  function verdict(got, asked) {
    const wanted = Math.log(asked);
    if (Math.abs(wanted) < 1e-3) return 'waiting';
    const share = Math.log(got) / wanted;
    if (share > 3) return 'flung';
    if (share > 1.33) return 'over';
    if (share >= 0.75) return 'asked';
    return 'short';
  }

  function result(read, active, scenario) {
    if (scenario.measure === 'trip') {
      const off = read.from_set_up / active.home;
      return {
        verdict: off < 0.01 ? 'returned' : 'off',
        figure: figure(off) + ' home distances',
        live: 'ends ' + figure(off) + ' home distances from the start',
      };
    }
    const got = read.sol / active.sol;
    const asked = scenario.measure === 'wheel'
      ? Math.pow(state.spec.factor_notch, -active.notches)
      : (active.gap > 0 ? active.gap_from / active.gap : 1);
    return {
      verdict: verdict(got, asked),
      figure: TIMES + figure(got),
      live: 'asked ' + TIMES + figure(asked) + DOT + 'got ' + TIMES + figure(got),
    };
  }

  function measure() {
    let read;
    try { read = JSON.parse(nimMockupReadout()); } catch (e) { return; }
    const parts = ['eye from Sol ' + figure(read.sol) + ' AU', 'to pivot ' + figure(read.pivot),
      'local scale ' + figure(read.scale)];
    if (read.taken >= 0) parts.push('to last zoom’s point ' + figure(read.taken));
    $('mockup-read').textContent = parts.join(DOT);
    const active = state.active;
    if (!active) return;
    const scenario = state.spec.scenarios[active.scenario];
    const found = result(read, active, scenario);
    const said = found.verdict === 'waiting' ? 'set up. Do the steps.'
      : found.live + DOT + VERDICTS[found.verdict];
    $('mockup-live').textContent = active.option + DOT + scenario.name + DOT + said;
    if (found.verdict === 'waiting') return;
    state.results[active.scenario + ':' + active.option] = found;
    save('results', state.results);
    table();
  }

  function cell(found) {
    if (!found) return '<td></td>';
    return '<td class="mockup-verdict-' + found.verdict + '">' + VERDICTS[found.verdict] +
      '<small>' + found.figure + '</small></td>';
  }

  function table() {
    const spec = state.spec;
    const head = '<tr><th>Scenario</th>' +
      spec.options.map((o) => '<th>' + o.key + '</th>').join('') + '</tr>';
    const rows = spec.scenarios.map((s, i) => '<tr><th>' + (i + 1) + '. ' + s.name + '</th>' +
      spec.options.map((o) => cell(state.results[i + ':' + o.key])).join('') + '</tr>');
    $('mockup-table').innerHTML = head + rows.join('');
  }

  function rings(targets) {
    const box = $('mockup-rings');
    box.textContent = '';
    const c = canvas();
    if (!c || !targets) return;
    const rect = c.getBoundingClientRect();
    targets.forEach((target, i) => {
      const ring = document.createElement('div');
      ring.className = 'mockup-ring';
      ring.style.left = (rect.left + target[0]) + 'px';
      ring.style.top = (rect.top + target[1]) + 'px';
      const label = document.createElement('span');
      label.textContent = targets.length > 1 ? 'finger ' + (i + 1) : 'here';
      ring.appendChild(label);
      box.appendChild(ring);
    });
  }

  function stop(message) {
    state.active = null;
    rings(null);
    $('mockup-live').textContent = message;
  }

  function show() {
    const spec = state.spec;
    for (const button of document.querySelectorAll('[data-option]')) {
      button.setAttribute('aria-pressed', String(button.dataset.option === state.option));
    }
    for (const button of document.querySelectorAll('[data-scenario]')) {
      const is_on = Number(button.dataset.scenario) === state.scenario;
      button.setAttribute('aria-pressed', String(is_on));
    }
    const option = spec.options.find((o) => o.key === state.option);
    $('mockup-option-name').textContent = option.name + '.';
    $('mockup-option-text').textContent = option.text;
    const scenario = spec.scenarios[state.scenario];
    $('mockup-scenario-name').textContent = DOT + (state.scenario + 1) + '. ' + scenario.name;
    $('mockup-steps').innerHTML = scenario.steps.map((s) => '<li>' + s + '</li>').join('');
    $('mockup-watch').textContent = 'Watch: ' + scenario.watch;
  }

  function pickOption(key) {
    state.option = key;
    nimMockupSetOption(key);
    save('option', key);
    show();
    stop('Option ' + key + '. Press Set up.');
    focusView();
  }

  function pickScenario(index) {
    state.scenario = index;
    save('scenario', index);
    show();
    stop('Scenario ' + (index + 1) + '. Press Set up.');
  }

  function collapse(is_collapsed) {
    $('mockup-body').hidden = is_collapsed;
    $('mockup-head').setAttribute('aria-expanded', String(!is_collapsed));
    $('mockup-caret').innerHTML = is_collapsed ? '&#9656;' : '&#9662;';
  }

  // Each scenario builds scene of its own; page adopts it as it adopts demo it loads.
  function setUp() {
    requestAnimationFrame(() => {
      const c = canvas();
      const out = JSON.parse(nimMockupSetUp(state.scenario, c.clientWidth, c.clientHeight));
      if (typeof adoptConstructionSelection === 'function') adoptConstructionSelection();
      $('mockup-live').classList.toggle('mockup-error', Boolean(out.error));
      if (out.error) { stop(out.error); return; }
      rings(out.targets);
      const read = JSON.parse(nimMockupReadout());
      state.active = { scenario: state.scenario, option: state.option, sol: read.sol,
        notches: 0, gap_from: 0, gap: 0, home: out.home };
      $('mockup-live').textContent = state.option + DOT +
        state.spec.scenarios[state.scenario].name + DOT + 'set up. Do the steps.';
      if (window.innerWidth < 720) collapse(true);
      focusView();
    });
  }

  function spread(touches) {
    const [a, b] = [touches[0], touches[1]];
    return Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
  }

  function listen() {
    for (const button of document.querySelectorAll('[data-option]')) {
      button.addEventListener('click', () => pickOption(button.dataset.option));
    }
    for (const button of document.querySelectorAll('[data-scenario]')) {
      button.addEventListener('click', () => pickScenario(Number(button.dataset.scenario)));
    }
    $('mockup-go').addEventListener('click', setUp);
    $('mockup-head').addEventListener('click', () => collapse(!$('mockup-body').hidden));
    const quiet = { capture: true, passive: true };
    window.addEventListener('wheel', (e) => {
      if (!state.active) return;
      if (e.target instanceof Element && e.target.closest('#mockup')) return;
      state.active.notches += nimNotchesWheel(e.deltaY, e.deltaMode);
    }, quiet);
    window.addEventListener('touchstart', (e) => {
      if (!state.active || e.touches.length !== 2) return;
      state.active.gap = state.active.gap_from = spread(e.touches);
    }, quiet);
    window.addEventListener('touchmove', (e) => {
      if (!state.active || e.touches.length !== 2 || state.active.gap_from <= 0) return;
      state.active.gap = spread(e.touches);
    }, quiet);
    window.addEventListener('resize', () => stop('Frame changed. Press Set up again.'));
  }

  function build(spec) {
    $('mockup-title').textContent = spec.title;
    $('mockup-question').textContent = spec.question;
    $('mockup-how').innerHTML = spec.how.map((s) => '<li>' + s + '</li>').join('');
    $('mockup-options').innerHTML = spec.options.map((o) =>
      '<button class="mockup-pick is-key" type="button" data-option="' + o.key +
      '" title="' + o.name + '">' + o.key + '</button>').join('');
    $('mockup-scenarios').innerHTML = spec.scenarios.map((s, i) =>
      '<button class="mockup-pick" type="button" data-scenario="' + i +
      '" title="' + s.name + '">' + (i + 1) + '</button>').join('');
  }

  function boot() {
    const is_ready = typeof nimMockupSpec === 'function' && canvas() &&
      canvas().clientWidth > 0;
    if (!is_ready) { setTimeout(boot, 200); return; }
    const spec = state.spec = JSON.parse(nimMockupSpec());
    build(spec);
    listen();
    state.results = load('results', {});
    const keys = spec.options.map((o) => o.key);
    const option = load('option', keys[0]);
    state.option = keys.includes(option) ? option : keys[0];
    const scenario = load('scenario', 0);
    state.scenario = scenario >= 0 && scenario < spec.scenarios.length ? scenario : 0;
    nimMockupSetOption(state.option);
    show();
    table();
    setUp();
    setInterval(measure, 200);
  }
  boot();
})();
</script>
