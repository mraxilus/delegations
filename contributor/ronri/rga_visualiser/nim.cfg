# Configure every build of this project: where PGA library sits, and which algebra it is.
#   Library is restored under `deps/` by Atlas and never committed (Article XI.3). It sits
#   three directories inside replications repository, and Atlas clones whole repositories,
#   so path names subdirectory rather than checkout root; `atlas.lock` records directory
#   name, which Atlas derives from clone URL.
#   Metric is project-wide rather than per entry point: this visualiser is of rigid
#   geometric algebra in four dimensions, and every target, test and front-end wants that
#   one algebra (Article II.1). Capacities stay per entry point, since tests vary them.

--path:"deps/replications.mraxilus.gitlab.com/lengyel/projective_geometric_algebra_illuminated"
--define:"pga.dimensions=4"
--define:"pga.is_conformal=false"

############# begin Atlas config section ##########
--noNimblePath
############# end Atlas config section   ##########
