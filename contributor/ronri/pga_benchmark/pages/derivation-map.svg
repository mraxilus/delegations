<!-- Derivation map of P01, after Lengyel's figure 2.16, for RGA and CGA, with transwedge.
     Colours are shell tokens, with fallbacks so file reads alone. Proposal embeds it.
     Five blocks, one group of derivations each; table from other block is dashed node, so no
     line leaves its block. Formula sits on its line, builder under it, as in figure.
     Brown text holds in RGA alone, blue in CGA alone, in place of written algebra names.
     Bar under or over bold letter is decoration, mark kept at size zero: face gives no anchor.
     Bar over group of signs is decoration alone. Tilde is spacing ˜, set over or under letter. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1412" class="map" role="img"
  aria-labelledby="map-title map-desc">
<title id="map-title">Derivation map</title>
<desc id="map-desc">Five blocks derive every table from the metric and the orientation of the
  volume element. Fixed definitions give the reverse, the exterior product, the exomorphism and
  the complements. The anti side conjugates each base table by complements. Maps give the duals
  and the dual products. The transwedge gives the dot at equal grades and the geometric products
  as signed sums. The projective vectors give the horizon, attitude, carrier, parts and norms.
  Each line carries its formula and the function that builds it.</desc>
<style>
.map text { font-family: var(--sans, sans-serif); font-size: 12px; fill: var(--ink-2, #465262); }
.map .title { font-size: 13px; fill: var(--ink, #16202c); }
.map .code { font-family: var(--mono, monospace); font-size: 10.5px; }
.map .quiet { font-size: 11.5px; fill: var(--muted, #667384); }
.map .input { fill: var(--pass-wash, #e3f4ea); stroke: var(--pass, #1f7a4d); stroke-width: 2.25; }
.map .fixed { fill: var(--hover, #eef2f6); stroke: var(--bound, #2a78d6); stroke-width: 1.25; }
.map .anti { fill: var(--status-wash, #ece9f8); stroke: var(--status, #5a4a9c);
  stroke-width: 1.25; }
.map .emission { fill: var(--track, #edf0f4); stroke: var(--rule-strong, #c6ced8);
  stroke-width: 1.25; }
.map .block { fill: none; stroke: var(--rule-strong, #c6ced8); stroke-width: 1; }
.map .blockname { font-size: 12.5px; fill: var(--muted, #667384); }
.map .edgecode { font-size: 10px; fill: var(--muted, #667384); }
.map .ref { fill: var(--surface, #ffffff); stroke: var(--muted, #667384); stroke-width: 1;
  stroke-dasharray: 4 3; }
.map .base { fill: var(--track, #edf0f4); stroke: var(--rule-strong, #c6ced8); stroke-width: 1.25; }
.map .rga { fill: var(--literal, #8a4a12); }
.map .cga { fill: var(--name, #1d5fa8); }
.map .edge { fill: none; stroke: var(--muted, #667384); stroke-width: 1.25; }
.map .head { fill: var(--muted, #667384); }
</style>
<defs><marker id="map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
  markerHeight="6" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/>
</marker></defs>
