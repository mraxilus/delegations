# Configure every build of this project: where PGA library sits, and which algebra is
#   default. Library is restored under `deps/` by Atlas and never committed (Article
#   XI.3). It sits three directories inside replications repository, and Atlas clones
#   whole repositories, so path names subdirectory rather than checkout root;
#   `atlas.lock` records directory name, which Atlas derives from clone URL.
#   Algebra named here is default only: four dimensions, rigid metric, i.e. 3D Euclidean
#   space. Test stubs and build driver pass `-d:pga.dimensions` and
#   `-d:pga.is_conformal` themselves; command line wins over this file, since compiler
#   reads configs first.

--path:"deps/replications.mraxilus.gitlab.com/lengyel/projective_geometric_algebra_illuminated"
--define:"pga.dimensions=4"
--define:"pga.is_conformal=false"

############# begin Atlas config section ##########
--noNimblePath
############# end Atlas config section   ##########
