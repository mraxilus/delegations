# Configure every build of this project: where packages Atlas restores sit, each under
#   `dependencies/`, which `atlas.lock` pins and git never keeps (Article XI.3).
#   `protobuf_serialization` reads and writes exchange files; rest are packages it needs.
#   `--noNimblePath` keeps packages nimble installed on machine out of every build.

############# begin Atlas config section ##########
--noNimblePath
--path:"dependencies/faststreams"
--path:"dependencies/npeg/src"
--path:"dependencies/protobuf_serialization"
--path:"dependencies/results"
--path:"dependencies/serialization"
--path:"dependencies/stew"
--path:"dependencies/unittest2"
############# end Atlas config section   ##########
