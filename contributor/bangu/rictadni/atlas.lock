  "nimcfg": [
    "# Configure every build of this project: where packages Atlas restores sit, each under",
    "#   `dependencies/`, which `atlas.lock` pins and git never keeps (Article XI.3).",
    "#   `protobuf_serialization` reads and writes exchange files; rest are packages it needs.",
    "#   `lojban_parser` is folder `contributor/bangu/lojban_parser` of repository Atlas clones",
    "#     whole, and requirement names no folder, so path below names it by hand.",
    "#   `--noNimblePath` keeps packages nimble installed on machine out of every build.",
    "",
    "--path:\"dependencies/lojban_parser/contributor/bangu/lojban_parser/src\"",
    "",
    "############# begin Atlas config section ##########",
    "--noNimblePath",
    "--path:\"dependencies/faststreams\"",
    "--path:\"dependencies/npeg/src\"",
    "--path:\"dependencies/protobuf_serialization\"",
    "--path:\"dependencies/results\"",
    "--path:\"dependencies/serialization\"",
    "--path:\"dependencies/stew\"",
    "--path:\"dependencies/unittest2\"",
    "############# end Atlas config section   ##########",
    ""
  ],
  "nimbleFile": {
    "filename": "rictadni.nimble",
    "content": [
      "# Package description read by Atlas and nimble; requirements live here (Article II.8).",
      "#   Lojban is read through `lojban_parser`, sibling project of this repository: parser exists",
      "#   to understand lojban, and this project to tag and search by it, so neither repeats other",
      "#   (II.8, II.9). Parser is package, at commit of `main` that `atlas.lock` holds, and",
      "#   `atlas.config` names repository and folder it lives in, since requirement reads no folder:",
      "#   import by path breaks wherever either folder moves (`PROVENANCE.md`, Reading through",
      "#   lojban_parser).",
      "#   `protobuf_serialization` of Status reads and writes exchange files of `suggester`:",
      "#   data one program writes and another reads is Protocol Buffers (CONTRIBUTOR.md, Data),",
      "#   external concern, so package; `atlas.lock` pins it with each package it needs.",
      "",
