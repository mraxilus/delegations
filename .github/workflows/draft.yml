# Return ready pull request to draft when push lands on it, so ready means what it says.
#   Carried-list rule "back to draft before another commit" had no reader: intent is
#   written nowhere, but push is. Push to ready pull request is fact GitHub records, so
#   this holds half of rule, and intent before push stays carried
#   (CONTRIBUTOR.md, `Carry the unchecked list in the open`). Delegate marks pull request
#   ready again once run is green.
#   `synchronize` fires on push to head branch; draft pull request is left alone, since it
#   says "not yet" already.
#   GitHub refuses `convertPullRequestToDraft` to run token (`Resource not accessible by
#   integration`, run 36850319568) and to fine-grained token with pull requests write
#   (`Resource not accessible by personal access token`, runs 36857266980 and 36893344447).
#   Classic token works but spans every public repository of account. So token of GitHub
#   App, installed on this repository alone, is minted per run from `DRAFT_APP_ID` and
#   `DRAFT_APP_KEY`. `permissions` is empty since run token does nothing here. Absent
#   secret is red run with reason, never silence.
#   `workflow_dispatch` with number is test of this file: it returns that pull request to
#   draft.
#   Cost: Architect sees pull request go draft on each push after ready, by design, two
#   secrets, and conversion attributed to App.

name: draft

on:
  pull_request:
    types: [synchronize]
  workflow_dispatch:
    inputs:
      number:
        description: Pull request to return to draft
        required: true

permissions: {}

jobs:
  draft:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - env:
          APP_ID: ${{ secrets.DRAFT_APP_ID }}
          APP_KEY: ${{ secrets.DRAFT_APP_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "DRAFT_APP_ID or DRAFT_APP_KEY is not stored, so nothing converts." >&2
            exit 1
          fi
      - id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DRAFT_APP_ID }}
          private-key: ${{ secrets.DRAFT_APP_KEY }}
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number || inputs.number }}
        run: gh pr ready "$NUMBER" --repo "$REPO" --undo
