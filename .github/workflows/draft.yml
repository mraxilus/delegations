# Return ready pull request to draft when push lands on it, so ready means what it says.
#   Carried-list rule "back to draft before another commit" had no reader: intent is
#   written nowhere, but push is. Push to ready pull request is fact GitHub records, so
#   this holds half of rule, and intent before push stays carried
#   (CONTRIBUTOR.md, `Carry the unchecked list in the open`). Delegate marks pull request
#   ready again once run is green.
#   `synchronize` fires on push to head branch; draft pull request is left alone, since it
#   says "not yet" already.
#   Token of run cannot convert pull request to draft: GitHub answers `Resource not
#   accessible by integration` to `convertPullRequestToDraft` whatever `permissions` grants.
#   So `ADMIN_TOKEN` does it, and needs pull requests write. `permissions` is empty since
#   run token does nothing here. Absent token is red run with reason, never silence.
#   `workflow_dispatch` with number is test of this file: it returns that pull request to
#   draft.
#   Cost: Architect sees pull request go draft on each push after ready, by design, and
#   conversion is attributed to account of token.

name: draft

on:
  pull_request:
    types: [synchronize]
  workflow_dispatch:
    inputs:
      number:
        description: Pull request to return to draft
        required: true

permissions: {}

jobs:
  draft:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number || inputs.number }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ADMIN_TOKEN is not stored, so nothing returns #$NUMBER to draft." >&2
            exit 1
          fi
          gh pr ready "$NUMBER" --repo "$REPO" --undo
