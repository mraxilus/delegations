# Hold every pull request to role line and label its branch names, before it can merge.
#   Rule is first of CONTRIBUTOR.md's carried list. `ledger.yml` reads same two facts, but
#   daily and over open items only, so it reports after merge; this gates before it.
#
#   Separate workflow rather than job in `check.yml`, for one reason: this must fire when
#   label changes, and label is applied after opening. Widening that workflow's types would
#   re-run all of its jobs on every label event, where this runs one. Cost: its name is its own,
#   so branch protection lists `role` by hand (CURATOR.md, repository settings section).
#   `ready_for_review` is here because draft is where delegate fixes this, and flipping to
#   ready must re-ask rather than carry draft's verdict.
#
#   Body and label names reach koch through environment, never interpolated into script, as
#   `check.yml` does with branch and event kind: body is whatever somebody typed, and label
#   names are theirs too. Labels arrive as JSON array, which `--json labels` emits through
#   `jq` and koch parses.
#   Labels are read through API rather than from event payload: GitHub sends `opened` before
#   `labeled`, so payload's list is empty on `opened`. API answers with labels that stand when
#   check runs. Cost: `pull-requests: read`.
#   `permissions` block is whole grant: `contents` is what checkout uses, and `pull-requests`
#   is what `gh pr view` uses.
#   `concurrency` group carries event's own action, so `opened`, `labeled` and
#   `ready_for_review` do not cancel each other. They fire from same act of opening pull
#   request, and cancelled run is not success: where branch protection requires this check,
#   cancellation that lands last leaves pull request blocked. Stale run of same action still
#   cancels, which is what group is for.
#   Version is koch's, as `check.yml` states it, and `toolchain.nim` holds both to it.

name: role

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

env:
  NIM_VERSION: '2.2.12'

concurrency:
  group: role-${{ github.event.pull_request.number }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  role:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.head_ref }}
      ROLE_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v7
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Read is its own assignment, since `set -e` takes substitution's exit only where no
          #   command word follows: `ROLE_LABELS="$(gh ...)" nim ...` would swallow failed read
          #   and run koch on empty list, which reports as missing label.
          labels="$(gh pr view "$NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name]')"
          ROLE_LABELS="$labels" nim r koch role
