# Ask npm weekly for advisories of each node lock, and keep one issue open for each project
#   while its lock holds package that npm names in advisory.
#   Each project keeps its npm packages up to date, security fixes first (CONTRIBUTOR.md,
#   TypeScript and Node). `koch advisories` reads lock alone through `npm audit`, and exits 1
#   where npm names package of lock, and 2 where answer cannot stand (`packages_node.nim`).
#   Package behind latest release prints line that fails nothing, which run log keeps and issue
#   leaves out, so new release of tool never comments. Verdict varies with npm rather than with
#   code, so it never runs where merge waits, as `head.yml` holds for `head` and `nim.yml` for
#   Nim releases.
#
#   One issue per project, never one per run. Open issue carrying project's marker is edited to
#   latest run, so it always says what is, and gains comment only where finding changed:
#   subscriber hears of new advisory once. Run where verb exits 0 closes open issue, so next
#   advisory opens fresh one.
#   Finding is not red run: exit 1 is what issue is for, and job stays green. Any other exit,
#   such as failure of search or usage error, turns job red, as failure to set up or post does,
#   and `watch.yml` reads that. So does exit 1 with no count of findings, which crash of koch
#   gives. So issue names advisory alone, and failure of one week never edits it.
#   Koch builds in step of its own, so compile failure turns job red rather than opening issue,
#   and finding holds output of verb alone.
#   Issue opens with role line after marker, as `watch.yml` writes it, and says workflow wrote
#   it, so nobody reads it as delegate having judged anything. Labels are project's directory,
#   which is its role string, copied rather than composed, and `curator`, as #1045 asks.
#
#   Matrix job per project, as `head.yml`, from `list-projects --all --node`, which keeps
#   projects carrying node manifest beside its lock. Each job builds koch on `NIM_VERSION`
#   alone, since verb compiles no project code. Issue step is copy of step of `head.yml` and
#   `nim.yml`, since workflow shares steps only through action of its own (Article II.9); fix to
#   one is finished when all three are checked.
#   `concurrency` holds one run at time, so two runs cannot both find no issue and open two.
#   `permissions` block is whole grant: `contents: read` for checkout, `issues: write` for
#   `gh issue`, and `actions: read` since run's own link spells `/actions/`, which
#   `workflows.nim` reads as reach.
#   Weekly, as Architect asked, so advisory waits one week at most before issue says so.
#   Cost: npm of runner image serves verb, so its version moves with image, never with commit.

name: npm

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

concurrency:
  group: npm
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write

env:
  NIM_VERSION: '2.4.2'

jobs:
  list-projects:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.select.outputs.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - id: select
        # Assigned before echoed, as in `check.yml`: substitution inside `echo` cannot fail step.
        run: |
          node="$(nim r koch list-projects --all --node)"
          echo "node=$node" >> "$GITHUB_OUTPUT"

  advisories:
    needs: list-projects
    if: needs.list-projects.outputs.node != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.list-projects.outputs.node) }}
    steps:
      - uses: actions/checkout@v7
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - run: nim c koch

      # Exit is read rather than obeyed: exit 1 is finding for issue, never red job.
      - id: run
        env:
          PROJECT: ${{ matrix.dir }}
        run: |
          code=0
          ./koch advisories "$PROJECT" > "$RUNNER_TEMP/advisories.txt" 2>&1 || code=$?
          cat "$RUNNER_TEMP/advisories.txt"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Edit, open or close issue standing for project's lock
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PROJECT: ${{ matrix.dir }}
          CODE: ${{ steps.run.outputs.code }}
          NUMBER: ${{ github.run_number }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          marker="<!-- npm:$PROJECT -->"
          name="${PROJECT##*/}"
          today="$(date -u +%F)"
          at="**Run [$NUMBER]($URL)** on $today, at \`${SHA:0:7}\`."

          # Exit other than 0 and 1 is failure of run rather than finding, so job goes red.
          if [ "$CODE" != 0 ] && [ "$CODE" != 1 ]; then
            echo "Verb exited $CODE, which names neither clean lock nor advisory."
            exit 1
          fi

          # Exit 1 is advisory only beside count of findings that koch prints last. Crash of koch
          #   exits 1 too, with trace and no count, so it turns job red rather than opening issue.
          counted='^[1-9][0-9]* finding\(s\)\.$'
          if [ "$CODE" = 1 ] && ! grep -Eq "$counted" "$RUNNER_TEMP/advisories.txt"; then
            echo "Verb exited 1 with no count of findings, so koch failed rather than found."
            exit 1
          fi

          # Dispatch from other branch reads locks of that branch, so it prints verdict and edits
          #   no issue; check above still turns its job red.
          if [ "${GITHUB_REF:-}" != refs/heads/main ]; then
            echo "Run on ${GITHUB_REF:-no ref} edits no issue, since issue holds verdict of main."
            exit 0
          fi

          # Read open issues rather than search: search indexing lags, and duplicate opened
          #   because index was cold is exactly noise this avoids.
          existing="$(gh issue list --repo "$REPO" --label "$PROJECT" --state open \
            --limit 100 --json number,body \
            --jq "[.[] | select(.body | contains(\"$marker\")) | .number] | first // empty")"

          if [ "$CODE" = 0 ]; then
            if [ -n "$existing" ]; then
              passed="The \`advisories\` verb exited 0, so this workflow closes the issue. A"
              passed="$passed later advisory opens a new one."
              closing="$(printf '**Role:** curator\n\n%s %s\n' "$at" "$passed")"
              gh issue close "$existing" --repo "$REPO" --reason completed --comment "$closing"
              echo "Closed issue #$existing."
            fi
            exit 0
          fi

          # Lines of tools behind latest release stay out of issue, so new release of tool never
          #   reads as change of finding; run log keeps them.
          finding="$(awk '/^Dev dependencies behind latest release/ {skip = 1; next}
            skip && /^  / {next} {skip = 0; print}' "$RUNNER_TEMP/advisories.txt" \
            | tail -c 20000)"

          # Paragraphs appended rather than written as heredoc: issue body renders each newline
          #   as line break, so paragraph wrapped to width here would break mid-sentence there.
          said="Opened by the \`npm\` workflow rather than by a delegate, so nothing here has"
          said="$said been read or judged yet. npm names a package of the lock of this project"
          said="$said in an advisory. Move each such package to its fix (CONTRIBUTOR.md,"
          said="$said TypeScript and Node)."
          next="Each week that the verb still exits 1, this issue is edited to the latest run. It"
          next="$next gains a comment only where the finding changed. A run where the verb"
          next="$next exits 0 closes this issue."
          fence='````'
          body="$(printf '%s\n\n**Role:** curator\n\n%s\n\n%s\n\n%stext\n%s\n%s\n\n%s\n' \
            "$marker" "$said" "$at" "$fence" "$finding" "$fence" "$next")"

          if [ -z "$existing" ]; then
            opened="$(gh issue create --repo "$REPO" --label "$PROJECT" --label curator \
              --title "The lock of \`$name\` holds a package with an advisory" --body "$body")"
            echo "Opened $opened."
            exit 0
          fi

          # Finding of last edit is text between fences; comment only where it moved.
          before="$(gh issue view "$existing" --repo "$REPO" --json body --jq .body \
            | tr -d '\r' | awk -v fence="$fence" '$0 == fence "text" {inside = 1; next}
              $0 == fence {inside = 0} inside {print}')"
          gh issue edit "$existing" --repo "$REPO" --body "$body"
          echo "Edited issue #$existing."
          if [ "$before" != "$finding" ]; then
            changed="$(printf '**Role:** curator\n\n%s %s\n' "$at" \
              "The finding changed, and the issue now holds it.")"
            gh issue comment "$existing" --repo "$REPO" --body "$changed"
            echo "Commented on issue #$existing."
          fi
