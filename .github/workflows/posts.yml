# Comment once where issue or comment lands without role line, from any client, as it lands.
#   `body` hook refuses such post inside Claude Code; client outside it reaches GitHub
#   unchecked, and ledger reads bodies daily and comments never. This reads both as they land.
#   Role line is first non-blank line opening `**Role:** ` (role.nim), with leading HTML
#   comment allowed, as ledger allows for watcher's marker.
#   Post by github-actions is skipped, so this never answers itself, watcher or ledger.
#   `permissions` block is whole grant: `issues: write` is what `gh issue comment` uses, and
#   it reaches pull request comments too, since those are issue comments.
#   Cost: edit that still lacks role line earns second comment; rare, and loud by design.

name: posts

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  issues: write

jobs:
  role-line:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      BODY: ${{ github.event.comment.body || github.event.issue.body }}
      KIND: ${{ github.event_name }}
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          first="$(printf '%s\n' "$BODY" | sed -e 's/<!--.*-->//' | awk 'NF {print; exit}')"
          case "$first" in
            '**Role:** '*) exit 0 ;;
          esac
          what="issue"
          if [ "$KIND" = issue_comment ]; then what="comment"; fi
          gh issue comment "$NUMBER" --repo "$REPO" --body "**Role:** curator

          This $what opens with no role line. Every post opens with \`**Role:** <role>\`, copied
          from the branch grammar (CONTRIBUTOR.md, Say which role you are). The \`posts\`
          workflow wrote this comment, and nobody judged anything.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
