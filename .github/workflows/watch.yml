# Open issue when workflow goes red on main, so nobody has to be awake for it.
#   CURATOR.md, Every delegate begins here, has curator read latest `push` run: subscriptions
#   do not cover `main`, and duty 2 has curator watch only their own merge. Reading is memory,
#   and memory fails quietly. So red run becomes issue labelled `curator`, which is queue
#   every delegate reads first: existing rule produces artifact rule already asks next delegate
#   to read, and no new rule is written.
#
#   Separate workflow because run cannot watch its own outcome, and `workflow_run` fires only
#   from copy of this file on default branch -- which is why `workflow_dispatch` takes run to
#   read: that is how it is driven against real red run rather than against manufactured one.
#   `branches: [main]` matches head branch of run, and fork's pull request from its own `main`
#   carries that name too; so run that `pull_request` triggered is skipped by event, never by
#   branch.
#   One issue per workflow, not one per run: watcher opening issue per red run trains its reader
#   to skim. Marker in body carries workflow's own name, so red `ledger` never hides behind
#   issue somebody closed because `check` went green; later red run of same workflow comments
#   on open issue.
#   `concurrency` group is workflow run read, so two red runs of one workflow finishing
#   together cannot both list issues, find none, and open two. Queued run waits rather than
#   cancels. Cost: third red run arriving while second waits replaces it, so issue gains
#   first and third comments and never second.
#   Issue opens with role line after marker, as every issue does, and says workflow wrote it,
#   so nobody reads it as delegate having judged anything.
#   Cost: `issues: write`, which `ledger.yml` holds as well. Neither runs on event that pull
#   request can reach, which is what keeps grant narrow.
#   `permissions` block is whole grant, never addition to default: scope left out of it is set
#   to `none`. Every scope steps use is listed, and `workflows.nim` holds that.

name: watch

on:
  workflow_run:
    workflows: [check, ledger]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Run to read, for driving this against a red run that already happened
        required: true

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  red:
    # Dispatch names run deliberately, so it reports whatever that run concluded; `workflow_run`
    #   fires on every completion, and only failure of run on `main` itself is worth reporting.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event != 'pull_request')
    # On job rather than workflow, so only red runs queue here: green completion arriving
    #   later can never replace pending red one.
    concurrency:
      group: watch-${{ github.event.workflow_run.name || inputs.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Read run, then open or add to issue standing for red main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          run="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
          conclusion="$(jq -r .conclusion <<<"$run")"
          if [ "$conclusion" != "failure" ]; then
            echo "Run $RUN_ID concluded \`$conclusion\`; nothing to report."
            exit 0
          fi
          url="$(jq -r .html_url <<<"$run")"
          number="$(jq -r .run_number <<<"$run")"
          sha="$(jq -r .head_sha <<<"$run")"
          subject="$(jq -r .display_title <<<"$run")"
          # Marker carries workflow's own name, so red `ledger` never hides behind issue
          #   somebody closed because `check` went green. Read from run rather than from
          #   event, since dispatch names run and reads same fields either way.
          workflow="$(jq -r .name <<<"$run")"
          marker="<!-- watch:red:$workflow -->"
          failed="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | "- `" + .name + "`"')"

          # Paragraphs appended rather than written as heredoc: issue body renders each newline
          #   as line break, so paragraph wrapped to width here would break mid-sentence there.
          said="Opened by the \`watch\` workflow rather than by a delegate, so nothing here"
          said="$said has been read or judged yet. Workflow red on \`main\` is first work of"
          said="$said a delegate (CURATOR.md, Every delegate begins here)."
          at="**Run [$number]($url)** on \`main\`, at \`${sha:0:7}\` — $subject"
          next="Close this once \`$workflow\` is green again, naming what fixed it. A later"
          next="$next red run of that workflow comments here rather than opening second issue."
          body="$(printf '%s\n\n**Role:** curator\n\n%s\n\n%s\n\n%s\n\n%s\n\n%s\n' \
            "$marker" "$said" "$at" "Jobs that concluded failure:" "$failed" "$next")"

          # Read open issues rather than search: search indexing lags, and watcher that opens
          #   duplicate because index was cold is exactly noise this avoids.
          existing="$(gh issue list --repo "$REPO" --label curator --state open \
            --limit 100 --json number,body \
            --jq "[.[] | select(.body | contains(\"$marker\")) | .number] | first // empty")"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "Commented on issue #$existing."
          else
            opened="$(gh issue create --repo "$REPO" --label curator \
              --title "\`$workflow\` is red on main: run $number" --body "$body")"
            echo "Opened $opened."
          fi
