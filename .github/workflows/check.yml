# Run repository checks on pull requests, on main, and weekly over what merged that week.
#   `plan` names projects one change asks to compile, and again those of them carrying driven
#   checks. `static` runs whole-tree checks, which cost seconds and so stay unscoped. `scope`
#   and `commits` read branch. `project` is one matrix job per named project, each installing
#   that project's own pin. `driven` is second matrix over subset of same plan, building each
#   page and driving it through real events. `types` type-checks scripts of every changed
#   project carrying node manifest beside its lock. `base` refuses branch predating base's
#   charter or checker. `audit` reads verdicts of `plan`, `static`, `project`, `driven`,
#   `types` and `base`, and is gate branch protection requires, since matrix job names vary;
#   `scope` and `commits` are required by name (CURATOR.md, repository settings section).
#
#   `driven` is matrix where `types` is one job, and difference is what each verb compiles.
#   Type check derives declarations by reading source as text, so koch's compiler serves it;
#   driven check builds page through JS backend, which compiles project code, so it needs
#   that project's pin exactly as `project` does. Its system packages come from project's
#   declaration read through `koch system`, never from names written here (CONTRIBUTOR.md,
#   System dependencies).
#   Matrix runs in parallel, so wall time is slowest changed project, never sum of all.
#   `nim r koch ci` runs same checks locally before pull request opens; runner confirms,
#   never discovers.
#
#   `NIM_VERSION` builds koch and runs whole-tree checks. It is `curator/audit`'s pin, never
#   second pin, and `toolchain.nim` fails audit when any workflow disagrees with it. Every
#   project pins its own compiler: release version, which setup action installs, or full
#   commit, which is built from source here and cached by commit, so bootstrap is paid once.
#   Every compiler installs under runner temp, never in workspace: audit reads untracked
#   files, so toolchain inside checkout would be audited.
#
#   What runner fetches or builds is cached on thing that pins it, never on run: commit for
#   compiler built from source, `atlas.lock` for that project's checkouts, every
#   `package-lock.json` for npm's own store and Playwright's browsers. Changing lock changes
#   key, so stale entry is unreachable rather than wrong. Store and SDL3 prefix are keyed
#   loosely, with `restore-keys`, since each entry there is named by digest or commit and
#   checked on restore, so stale entry heals rather than ships; their steps say why.
#   Rejected: caching apt archives and `nimcache`, each small beside driven job's total
#   (curator/audit/PROVENANCE.md, Runner caches).
#   Actions are pinned to majors running node24, since runner retires node20. `cache@v5` and
#   later want runner 2.327.1 or newer. `checkout@v7` breaks only `pull_request_target`
#   defaults, and this workflow does not trigger on that event.
#   `permissions` block is whole grant: `contents: read` is what checkout uses, and nothing
#   here writes.
#   Branch names and event kind reach koch through environment, never interpolated into
#   script. Weekly run compiles projects whose code merged inside its window and nothing in
#   week nobody merged code, because rot arrives with merges. Cron here and `SWEEP_DAYS` in
#   `plan.nim` are one window named twice: change both together.

name: check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  NIM_VERSION: '2.2.12'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.select.outputs.projects }}
      driven: ${{ steps.select.outputs.driven }}
    env:
      BASE: >-
        ${{ github.event_name == 'pull_request'
            && format('origin/{0}', github.base_ref)
            || github.event.before }}
      SWEEP: ${{ github.event_name == 'schedule' && '--sweep' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - id: select
        # Assigned before echoed: substitution inside `echo` argument cannot fail step, so
        #   crashing `plan` would hand empty matrices on and fail at `project` instead.
        run: |
          projects="$(nim r koch plan $SWEEP)"
          driven="$(nim r koch plan $SWEEP --driven)"
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "driven=$driven" >> "$GITHUB_OUTPUT"

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # `koch tree` reads each record's `Pruned` row against its own log
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - run: nim r koch tree

  project:
    needs: plan
    if: needs.plan.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.projects) }}
    steps:
      - uses: actions/checkout@v7

      # Released compiler: setup action installs it.
      - if: matrix.kind == 'version'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
          parent-nim-install-directory: ${{ runner.temp }}

      # Commit-pinned compiler: no action installs one, so build it, once per commit.
      - if: matrix.kind == 'commit'
        id: built
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nim-commit
          key: nim-commit-${{ runner.os }}-${{ matrix.nim }}
      - if: matrix.kind == 'commit' && steps.built.outputs.cache-hit != 'true'
        env:
          COMMIT: ${{ matrix.nim }}
        run: |
          git clone --filter=blob:none https://github.com/nim-lang/Nim "$RUNNER_TEMP/nim-commit"
          cd "$RUNNER_TEMP/nim-commit"
          git checkout "$COMMIT"
          sh build_all.sh
      - if: matrix.kind == 'commit'
        run: echo "$RUNNER_TEMP/nim-commit/bin" >> "$GITHUB_PATH"

      # Atlas checkouts: `koch tests` restores them from lock on every run, and lock names
      #   exact commit each time, so cache keyed on that lock returns same tree it would
      #   have fetched. Key carries no project name: two projects sharing lock share tree it
      #   names, so entry either restores what that lock says or misses. Projects holding no
      #   lock skip step; `actions/cache` warns on absent path, and warning nobody acts on
      #   is noise.
      - id: locked
        env:
          PROJECT: ${{ matrix.dir }}
        run: |
          if [ -f "$PROJECT/atlas.lock" ]; then echo "is_locked=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.locked.outputs.is_locked == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ matrix.dir }}/deps
          key: atlas-${{ runner.os }}-${{ hashFiles(format('{0}/atlas.lock', matrix.dir)) }}

      - env:
          PROJECT: ${{ matrix.dir }}
        run: nim r koch tests "$PROJECT"

  driven:
    needs: plan
    if: needs.plan.outputs.driven != '[]'
    runs-on: ubuntu-latest
    # Whole suite drives real browser over thousands of objects under software rendering, so
    #   it is minutes rather than seconds. Ceiling is far above measured run and far below
    #   hang: job that stopped making progress should say so rather than hold runner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.driven) }}
    steps:
      - uses: actions/checkout@v7

      # Same two compiler arms as `project`, for reason header gives.
      - if: matrix.kind == 'version'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
          parent-nim-install-directory: ${{ runner.temp }}
      - if: matrix.kind == 'commit'
        id: built
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nim-commit
          key: nim-commit-${{ runner.os }}-${{ matrix.nim }}
      - if: matrix.kind == 'commit' && steps.built.outputs.cache-hit != 'true'
        env:
          COMMIT: ${{ matrix.nim }}
        run: |
          git clone --filter=blob:none https://github.com/nim-lang/Nim "$RUNNER_TEMP/nim-commit"
          cd "$RUNNER_TEMP/nim-commit"
          git checkout "$COMMIT"
          sh build_all.sh
      - if: matrix.kind == 'commit'
        run: echo "$RUNNER_TEMP/nim-commit/bin" >> "$GITHUB_PATH"

      # Packages come from project's own declaration; project declaring none installs none.
      - env:
          PROJECT: ${{ matrix.dir }}
        run: |
          PACKAGES="$(nim r koch system "$PROJECT")"
          if [ -n "$PACKAGES" ]; then
            sudo apt-get update -qq
            echo "$PACKAGES" | xargs sudo apt-get install -y --no-install-recommends
          fi

      - id: locked
        env:
          PROJECT: ${{ matrix.dir }}
        run: |
          if [ -f "$PROJECT/atlas.lock" ]; then echo "is_locked=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.locked.outputs.is_locked == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ matrix.dir }}/deps
          key: atlas-${{ runner.os }}-${{ hashFiles(format('{0}/atlas.lock', matrix.dir)) }}

      - run: mkdir -p ~/.npm
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      # Browser Playwright pins: `drive` fetches it, and nothing on runner installs one. Same
      #   lock is key: `package-lock.json` fixes `@playwright/test`, and that version fixes
      #   browser revision it installs, so tree lock names is tree this restores.
      #   Made before caching for reason npm's store is: run driving nothing never invokes it
      #   and leaves path absent, and `actions/cache` warns on absent path.
      #   Gain over apt install of `chromium` is unmeasured.
      - run: mkdir -p ~/.cache/ms-playwright
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      # Store `koch assets` fills is repository's rather than one project's, so key is its
      #   declaration and one entry serves every project's job. `assets.nim` says which bytes
      #   each name is; project's driver says only which names it wants, and moves most weeks.
      #   Made before caching, as npm's store and Playwright's are: job fetching nothing leaves
      #   path absent, and `actions/cache` warns on absent path.
      #   `restore-keys` is safe here by construction rather than by check: store names entries
      #   by digest, so entry no row declares is unreachable rather than wrong, and
      #   `koch assets` fetches what older restore lacks.
      #   Rejected: caching `build/fonts`; with store warm, `assets` copies faces into it in
      #   milliseconds, and second key over same bytes is one more thing to disagree.
      - run: mkdir -p ~/.cache/koch/assets
      - uses: actions/cache@v6
        with:
          path: ~/.cache/koch/assets
          key: assets-${{ runner.os }}-${{ hashFiles('curator/audit/src/assets.nim') }}
          restore-keys: assets-${{ runner.os }}-

      # SDL3 is cloned, configured and built from source, and no package carries it, so cold
      #   build is largest step nothing else caches (curator/audit/PROVENANCE.md, Runner
      #   caches). Install prefix alone is cached, never cmake build tree beside it:
      #   `versionSdl3` reads prefix's own `.pc`, so prefix is what makes `sdl3` return early,
      #   and stale build tree keeps what configure decided about machine that has changed.
      #   Key holds driver's hash, since driver holds `COMMIT_SDL3` and `SYSTEM`; `restore-keys`
      #   lets older prefix hit, since driver moves whenever project is worked on. Older prefix
      #   is safe: `versionSdl3` reads restored `.pc` and rebuilds where version misses pin.
      #   Key and restore key both carry project directory, so project that builds no SDL3
      #   never restores another project's prefix. Path is made first, as for other caches, so
      #   such project saves empty entry rather than warning.
      #   Cost: most runs stop exercising SDL3 build; pin is commit, so cache hides rebuild
      #   rather than upstream that moved.
      - env:
          PROJECT: ${{ matrix.dir }}
        run: mkdir -p "$PROJECT/build/sdl3"
      - uses: actions/cache@v6
        with:
          path: ${{ matrix.dir }}/build/sdl3
          key: >-
            sdl3-${{ runner.os }}-${{ matrix.dir }}-${{
            hashFiles(format('{0}/tools/build.nim', matrix.dir)) }}
          restore-keys: sdl3-${{ runner.os }}-${{ matrix.dir }}-

      - env:
          PROJECT: ${{ matrix.dir }}
        run: nim r koch driven "$PROJECT"

  types:
    runs-on: ubuntu-latest
    env:
      BASE: >-
        ${{ github.event_name == 'pull_request'
            && format('origin/{0}', github.base_ref)
            || github.event.before }}
      SWEEP: ${{ github.event_name == 'schedule' && '--sweep' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      # Node packages: `npm ci` refetches every run. Cache npm's own store rather than
      #   `node_modules`, which `npm ci` deletes before installing; lock names exact version
      #   of each, so hash of every lock is key that cannot serve wrong tree.
      #   Store is made before caching it, since run selecting no node project never invokes
      #   npm and leaves path absent, and `actions/cache` warns on absent path. Most runs
      #   select none, so warning would be on most runs and would mean nothing on any of
      #   them. Empty store saved under same key is harmless: first run using npm fills it.
      - run: mkdir -p ~/.npm
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - run: nim r koch types $SWEEP

  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.head_ref }}
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - run: nim r koch scope

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.head_ref }}
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - run: nim r koch commits

  base:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE: origin/${{ github.base_ref }}
    steps:
      # Branch head, never merge ref `pull_request` offers: that ref's first parent is base's
      #   tip, so what it gained over base is empty by construction and check reports nothing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - run: nim r koch base

  audit:
    needs: [plan, static, project, driven, types, base]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Read verdict of every job this gate stands for
        env:
          VERDICTS: >-
            plan=${{ needs.plan.result }}
            static=${{ needs.static.result }}
            project=${{ needs.project.result }}
            driven=${{ needs.driven.result }}
            types=${{ needs.types.result }}
            base=${{ needs.base.result }}
        run: |
          echo "$VERDICTS"
          case "$VERDICTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
