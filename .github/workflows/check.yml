# Run repository audit on every pull request and on main.
#   Three jobs so owner reads each verdict alone: `audit` (tree, dependencies, every
#   project's tests), `scope` (branch prefix), `commits` (Conventional Commits). Branch
#   protection on main requires all three. `nim r koch ci` at root runs same three verbs
#   locally, before any pull request is opened; runner confirms, never discovers.
#   Nim version pinned once here; CURATOR.md names this file as its source.
#   Nim installs under runner temp, never into workspace: audit reads untracked files, so
#   toolchain inside checkout would be audited (first run on main proved it).
#   Branch names reach koch through environment, never interpolated into script.

name: check

on:
  pull_request:
  push:
    branches: [main]

env:
  NIM_VERSION: '2.2.4'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - run: nim r koch audit

  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.head_ref }}
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - run: nim r koch scope

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.head_ref }}
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - run: nim r koch commits
