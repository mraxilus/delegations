# Run repository checks on pull requests, on main, and weekly over every project.
#   Nine jobs. `plan` names projects one change asks to compile, and names again which of
#   those carry driven checks; `static` runs whole-tree checks, which cost tenths of second
#   and so stay unscoped; `scope` and `commits` read branch; `project` is one matrix job per
#   named project, each installing that project's own pin; `driven` is second matrix over
#   subset of same plan, building each page and driving it through real events; `types`
#   type-checks scripts of every changed project carrying node manifest, on driver's own
#   compiler rather than through matrix, since `tools/build.nim` compiles no project code
#   and building commit-pinned compiler to run build script would cost minutes for no
#   checking; `base` refuses branch predating base's rules or checker; `audit` reads their
#   verdicts and is gate branch protection requires, so required names stay `audit`, `scope`,
#   `commits` while matrix names vary. `base`, `types` and `driven` reach merge through that
#   gate, which is why requiring branches up to date needs no paid ruleset here.
#   Weekly sweep has no base commit to scope against, so `types` takes `--all` there, as
#   `plan` takes `--sweep`; `driven` needs neither, since it filters plan's own selection.
#
#   `driven` is matrix where `types` is one job, and difference is what each verb compiles.
#   Type check derives declarations by reading source as text; driven check builds page
#   through JS backend, which compiles project code, so it needs that project's pin exactly
#   as `project` does. That is cost `plan.nim` recorded against `typeJobs` when it was
#   written, arriving as predicted. Its own system packages come from project's declaration
#   read through `koch system`, never from names written into this file, so project gains
#   what it needs by declaring it (CONTRIBUTOR.md, "System dependencies").
#   Matrix runs in parallel, so wall time is slowest changed project, never sum of all.
#   `nim r koch ci` at root runs same checks locally, before any pull request is opened;
#   runner confirms, never discovers.
#
#   Driver version builds koch and runs whole-tree checks; it is `curator/audit`'s pin,
#   never second pin, and `toolchain.nim` fails audit when this file disagrees with it.
#   Every project pins its own compiler in its nimble file, since no single version serves
#   all: `pga` needs 2.2.6 or later, `dance_ontology` crashes compiler on 2.2.8 and later.
#   Pin is release version, installed by setup action, or full commit, which no action
#   installs: those are built from source here and cached by commit, so bootstrap is paid
#   once. Commit pin exists for project following dependency onto devel; driver pin never
#   is one, since every job waits on driver job.
#   Compiler built from commit lives under runner temp, never in workspace, for same reason
#   installed one does: audit reads untracked files.
#   Nim installs under runner temp, never into workspace: audit reads untracked files, so
#   toolchain inside checkout would be audited (first run on main proved it).
#   What runner fetches or builds is cached on thing that pins it, never on run: commit for
#   compiler built from source, `atlas.lock` for that project's checkouts, every
#   `package-lock.json` for npm's own store, and driver holding face digests for faces it
#   pins. Key is pin itself, so cache cannot serve tree lock would not have fetched; changing
#   lock changes key, and stale entry is unreachable rather than wrong. Faces are stronger
#   still: build verifies each against its digest on restore and again before embedding, so
#   stale entry heals rather than ships. Rejected for now: caching apt archives, which saves
#   download and not install, and `nimcache`, which would be largest saving and whose
#   staleness is exactly failure repository refuses elsewhere -- check passing without
#   compiling what it claims. It needs driving against deliberately stale cache first.
#   Actions are pinned to majors running node24, since node20 runtime is being retired and
#   runner forces every node20 action onto node24 while warning on each job. `checkout@v7` and
#   `cache@v6` declare `runs.using: node24`; `@v4` of each declared node20, which is what
#   warning named. `cache@v5` and later want runner 2.327.1 or newer, and runners here report
#   2.337.0. Only breaking change either carries is `allow-unsafe-pr-checkout`, which is about
#   `pull_request_target` defaults; this workflow triggers on `pull_request`, so it does not
#   reach here.
#   Branch names and event kind reach koch through environment, never interpolated into
#   script. Weekly sweep compiles every project, since scoped runs leave unrelated rot
#   unseen until that project next changes; it skips itself in week nobody merged code,
#   because rot arrives with merges. Cron here and `SWEEP_DAYS` in `plan.nim` are one
#   window named twice: change both together.

name: check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

env:
  NIM_VERSION: '2.2.12'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.select.outputs.projects }}
      driven: ${{ steps.select.outputs.driven }}
    env:
      BASE: >-
        ${{ github.event_name == 'pull_request'
            && format('origin/{0}', github.base_ref)
            || github.event.before }}
      SWEEP: ${{ github.event_name == 'schedule' && '--sweep' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - id: select
        run: |
          echo "projects=$(nim r koch plan $SWEEP)" >> "$GITHUB_OUTPUT"
          echo "driven=$(nim r koch plan $SWEEP --driven)" >> "$GITHUB_OUTPUT"

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - run: nim r koch tree

  project:
    needs: plan
    if: needs.plan.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.projects) }}
    steps:
      - uses: actions/checkout@v7

      # Released compiler: setup action installs it.
      - if: matrix.kind == 'version'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
          parent-nim-install-directory: ${{ runner.temp }}

      # Commit-pinned compiler: no action installs one, so build it, once per commit.
      - if: matrix.kind == 'commit'
        id: built
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nim-commit
          key: nim-commit-${{ runner.os }}-${{ matrix.nim }}
      - if: matrix.kind == 'commit' && steps.built.outputs.cache-hit != 'true'
        env:
          COMMIT: ${{ matrix.nim }}
        run: |
          git clone --filter=blob:none https://github.com/nim-lang/Nim "$RUNNER_TEMP/nim-commit"
          cd "$RUNNER_TEMP/nim-commit"
          git checkout "$COMMIT"
          sh build_all.sh
      - if: matrix.kind == 'commit'
        run: echo "$RUNNER_TEMP/nim-commit/bin" >> "$GITHUB_PATH"

      # Atlas checkouts: `koch tests` restores them from lock on every run, and lock names
      #   exact commit each time, so cache keyed on that lock returns same tree it would
      #   have fetched. Key carries no project name: two projects sharing lock share tree it
      #   names, so entry either restores what that lock says or misses. Projects holding no
      #   lock skip step; `actions/cache` warns on absent path, and warning nobody acts on
      #   is noise.
      - id: locked
        env:
          PROJECT: ${{ matrix.dir }}
        run: |
          if [ -f "$PROJECT/atlas.lock" ]; then echo "is_locked=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.locked.outputs.is_locked == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ matrix.dir }}/deps
          key: atlas-${{ runner.os }}-${{ hashFiles(format('{0}/atlas.lock', matrix.dir)) }}

      - env:
          PROJECT: ${{ matrix.dir }}
        run: nim r koch tests "$PROJECT"

  driven:
    needs: plan
    if: needs.plan.outputs.driven != '[]'
    runs-on: ubuntu-latest
    # Whole suite drives real browser over thousands of objects under software rendering, so
    #   it is minutes rather than seconds. Ceiling is far above measured run and far below
    #   hang: job that stopped making progress should say so rather than hold runner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.driven) }}
    steps:
      - uses: actions/checkout@v7

      # Same two compiler arms as `project`, and for same reason: driven verb builds page
      #   through JS backend, which compiles project code, so it needs that project's own pin
      #   rather than driver's. `types` needs neither, which is why it is one job and this is
      #   matrix.
      - if: matrix.kind == 'version'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
          parent-nim-install-directory: ${{ runner.temp }}
      - if: matrix.kind == 'commit'
        id: built
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/nim-commit
          key: nim-commit-${{ runner.os }}-${{ matrix.nim }}
      - if: matrix.kind == 'commit' && steps.built.outputs.cache-hit != 'true'
        env:
          COMMIT: ${{ matrix.nim }}
        run: |
          git clone --filter=blob:none https://github.com/nim-lang/Nim "$RUNNER_TEMP/nim-commit"
          cd "$RUNNER_TEMP/nim-commit"
          git checkout "$COMMIT"
          sh build_all.sh
      - if: matrix.kind == 'commit'
        run: echo "$RUNNER_TEMP/nim-commit/bin" >> "$GITHUB_PATH"

      # Packages come from project's own declaration, never from names written here: workflow
      #   knows no project, exactly as it names none for matrix above (CONTRIBUTOR.md, "System
      #   dependencies"). Project declaring none installs none.
      - env:
          PROJECT: ${{ matrix.dir }}
        run: |
          PACKAGES="$(nim r koch system "$PROJECT")"
          if [ -n "$PACKAGES" ]; then
            sudo apt-get update -qq
            echo "$PACKAGES" | xargs sudo apt-get install -y --no-install-recommends
          fi

      - id: locked
        env:
          PROJECT: ${{ matrix.dir }}
        run: |
          if [ -f "$PROJECT/atlas.lock" ]; then echo "is_locked=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.locked.outputs.is_locked == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ matrix.dir }}/deps
          key: atlas-${{ runner.os }}-${{ hashFiles(format('{0}/atlas.lock', matrix.dir)) }}

      - run: mkdir -p ~/.npm
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      # Browser Playwright pins: `drive` fetches it, since nothing on runner installs one now
      #   that this job stopped naming `chromium`. Same lock is key, and not by convenience --
      #   `package-lock.json` fixes `@playwright/test`, and that version fixes browser revision
      #   it installs, so tree lock names is tree this restores.
      #   Made before caching for reason npm's store is: run driving nothing never invokes it
      #   and leaves path absent, and `actions/cache` warns on absent path.
      #   Cost this replaces was snap install of `chromium`, which was slowest item in apt step
      #   (repository issue 79). Whether that trade is net gain is unmeasured until both have
      #   run; figure belongs on that issue rather than asserted here.
      - run: mkdir -p ~/.cache/ms-playwright
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      # Faces are pinned to digests inside driver, and `assets` keeps one already carrying its
      #   pin, so cache keyed on that file returns what fetch would have written. Stronger
      #   than other two: `assets` re-fetches and refuses any face whose digest misses, and
      #   `web` verifies again before embedding, so stale entry heals rather than ships.
      #   Key is whole driver rather than digests alone, so it misses on edit that moved no
      #   face; cost is refetch of six files.
      - uses: actions/cache@v6
        with:
          path: ${{ matrix.dir }}/build/fonts
          key: faces-${{ runner.os }}-${{ hashFiles(format('{0}/tools/build.nim', matrix.dir)) }}

      # SDL3 is cloned, configured and built from source, and no package carries it, so cold
      #   job paid 55.8 s of run 214's 357 s for it -- largest single step nothing cached
      #   (repository issues 79 and 80, both of which named smaller levers).
      #   Install prefix alone is cached, never cmake build tree beside it: `versionSdl3`
      #   reads prefix's own `.pc`, so prefix is what makes `sdl3` return early, and build
      #   tree is what makes stale restore dangerous. Measured rather than feared: cmake tree
      #   carried from configure that found no X11 kept saying so after headers arrived, and
      #   cost hour on container that had them. Product caches; build tree does not.
      #   Key is same driver as faces, and that one file holds both `VERSION_SDL3` and
      #   `SYSTEM`, so moved pin and changed packages each miss it.
      #   Cost: most runs stop exercising SDL3 build. Every cache here trades that, but this
      #   one meets weak pin -- tag rather than commit, checked by version string it reports
      #   (repository issue 126) -- so cache makes moved tag less likely to be seen, which is
      #   argument for fixing pin rather than against caching product.
      - uses: actions/cache@v6
        with:
          path: ${{ matrix.dir }}/build/sdl3
          key: sdl3-${{ runner.os }}-${{ hashFiles(format('{0}/tools/build.nim', matrix.dir)) }}

      - env:
          PROJECT: ${{ matrix.dir }}
        run: nim r koch driven "$PROJECT"

  types:
    runs-on: ubuntu-latest
    env:
      BASE: >-
        ${{ github.event_name == 'pull_request'
            && format('origin/{0}', github.base_ref)
            || github.event.before }}
      ALL: ${{ github.event_name == 'schedule' && '--all' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      # Node packages: `npm ci` refetches every run. Cache npm's own store rather than
      #   `node_modules`, which `npm ci` deletes before installing; lock names exact version
      #   of each, so hash of every lock is key that cannot serve wrong tree.
      #   Store is made before caching it, since run selecting no node project never invokes
      #   npm and leaves path absent, and `actions/cache` warns on absent path. Most runs
      #   select none, so warning would be on most runs and would mean nothing on any of
      #   them. Empty store saved under same key is harmless: first run using npm fills it.
      - run: mkdir -p ~/.npm
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - run: nim r koch types $ALL

  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.head_ref }}
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - run: nim r koch scope

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.head_ref }}
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - run: nim r koch commits

  base:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - run: nim r koch base

  audit:
    needs: [plan, static, project, driven, types, base]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Read verdict of every job this gate stands for
        env:
          VERDICTS: >-
            plan=${{ needs.plan.result }}
            static=${{ needs.static.result }}
            project=${{ needs.project.result }}
            driven=${{ needs.driven.result }}
            types=${{ needs.types.result }}
            base=${{ needs.base.result }}
        run: |
          echo "$VERDICTS"
          case "$VERDICTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
