# Run repository checks on pull requests, on main, and weekly over every project.
#   Seven jobs. `plan` names projects one change asks to compile; `static` runs whole-tree
#   checks, which cost tenths of second and so stay unscoped; `scope` and `commits` read
#   branch; `project` is one matrix job per named project, each installing that project's
#   own pin; `types` type-checks scripts of every changed project carrying node manifest,
#   on driver's own compiler rather than through matrix, since `tools/build.nim` compiles
#   no project code and building commit-pinned compiler to run build script would cost
#   minutes for no checking; `base` refuses branch predating base's rules or checker;
#   `audit` reads their verdicts and is gate branch protection requires, so required names
#   stay `audit`, `scope`, `commits` while matrix names vary. `base` and `types` reach merge
#   through that gate, which is why requiring branches up to date needs no paid ruleset here.
#   Weekly sweep has no base commit to scope against, so `types` takes `--all` there, as
#   `plan` takes `--sweep`.
#   Matrix runs in parallel, so wall time is slowest changed project, never sum of all.
#   `nim r koch ci` at root runs same checks locally, before any pull request is opened;
#   runner confirms, never discovers.
#
#   Driver version builds koch and runs whole-tree checks; it is `curator/audit`'s pin,
#   never second pin, and `toolchain.nim` fails audit when this file disagrees with it.
#   Every project pins its own compiler in its nimble file, since no single version serves
#   all: `pga` needs 2.2.6 or later, `dance_ontology` crashes compiler on 2.2.8 and later.
#   Pin is release version, installed by setup action, or full commit, which no action
#   installs: those are built from source here and cached by commit, so bootstrap is paid
#   once. Commit pin exists for project following dependency onto devel; driver pin never
#   is one, since every job waits on driver job.
#   Compiler built from commit lives under runner temp, never in workspace, for same reason
#   installed one does: audit reads untracked files.
#   Nim installs under runner temp, never into workspace: audit reads untracked files, so
#   toolchain inside checkout would be audited (first run on main proved it).
#   What runner fetches or builds is cached on thing that pins it, never on run: commit for
#   compiler built from source, `atlas.lock` for that project's checkouts, every
#   `package-lock.json` for npm's own store. Key is pin itself, so cache cannot serve tree
#   lock would not have fetched; changing lock changes key, and stale entry is unreachable
#   rather than wrong. Rejected: caching `nimcache`, which would be largest saving and whose
#   staleness is exactly failure repository refuses elsewhere -- check passing without
#   compiling what it claims. It needs driving against deliberately stale cache first.
#   Branch names and event kind reach koch through environment, never interpolated into
#   script. Weekly sweep compiles every project, since scoped runs leave unrelated rot
#   unseen until that project next changes; it skips itself in week nobody merged code,
#   because rot arrives with merges. Cron here and `SWEEP_DAYS` in `plan.nim` are one
#   window named twice: change both together.

name: check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

env:
  NIM_VERSION: '2.2.4'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.select.outputs.projects }}
    env:
      BASE: >-
        ${{ github.event_name == 'pull_request'
            && format('origin/{0}', github.base_ref)
            || github.event.before }}
      SWEEP: ${{ github.event_name == 'schedule' && '--sweep' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - id: select
        run: echo "projects=$(nim r koch plan $SWEEP)" >> "$GITHUB_OUTPUT"

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - run: nim r koch tree

  project:
    needs: plan
    if: needs.plan.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4

      # Released compiler: setup action installs it.
      - if: matrix.kind == 'version'
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
          parent-nim-install-directory: ${{ runner.temp }}

      # Commit-pinned compiler: no action installs one, so build it, once per commit.
      - if: matrix.kind == 'commit'
        id: built
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nim-commit
          key: nim-commit-${{ runner.os }}-${{ matrix.nim }}
      - if: matrix.kind == 'commit' && steps.built.outputs.cache-hit != 'true'
        env:
          COMMIT: ${{ matrix.nim }}
        run: |
          git clone --filter=blob:none https://github.com/nim-lang/Nim "$RUNNER_TEMP/nim-commit"
          cd "$RUNNER_TEMP/nim-commit"
          git checkout "$COMMIT"
          sh build_all.sh
      - if: matrix.kind == 'commit'
        run: echo "$RUNNER_TEMP/nim-commit/bin" >> "$GITHUB_PATH"

      # Atlas checkouts: `koch tests` restores them from lock on every run, and lock names
      #   exact commit each time, so cache keyed on that lock returns same tree it would
      #   have fetched. Key carries no project name: two projects sharing lock share tree it
      #   names, so entry either restores what that lock says or misses. Projects holding no
      #   lock skip step; `actions/cache` warns on absent path, and warning nobody acts on
      #   is noise.
      - id: locked
        env:
          PROJECT: ${{ matrix.dir }}
        run: |
          if [ -f "$PROJECT/atlas.lock" ]; then echo "is_locked=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.locked.outputs.is_locked == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ matrix.dir }}/deps
          key: atlas-${{ runner.os }}-${{ hashFiles(format('{0}/atlas.lock', matrix.dir)) }}

      - env:
          PROJECT: ${{ matrix.dir }}
        run: nim r koch tests "$PROJECT"

  types:
    runs-on: ubuntu-latest
    env:
      BASE: >-
        ${{ github.event_name == 'pull_request'
            && format('origin/{0}', github.base_ref)
            || github.event.before }}
      ALL: ${{ github.event_name == 'schedule' && '--all' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      # Node packages: `npm ci` refetches every run. Cache npm's own store rather than
      #   `node_modules`, which `npm ci` deletes before installing; lock names exact version
      #   of each, so hash of every lock is key that cannot serve wrong tree.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - run: nim r koch types $ALL

  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.head_ref }}
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - run: nim r koch scope

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.head_ref }}
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - run: nim r koch commits

  base:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          parent-nim-install-directory: ${{ runner.temp }}
      - run: nim r koch base

  audit:
    needs: [plan, static, project, types, base]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Read verdict of every job this gate stands for
        env:
          VERDICTS: >-
            plan=${{ needs.plan.result }}
            static=${{ needs.static.result }}
            project=${{ needs.project.result }}
            types=${{ needs.types.result }}
            base=${{ needs.base.result }}
        run: |
          echo "$VERDICTS"
          case "$VERDICTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac
