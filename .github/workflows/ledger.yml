# Ledger of rules GitHub already records, so remembering them is not their only enforcement.
#   CONTRIBUTOR.md keeps carried list of rules holding by reading alone, and CURATOR.md sets
#   test for what belongs on it: whether what rule asks about is fact something already writes
#   down. Role line and label, closing by hand, and readiness each have half GitHub records;
#   ledger reads that half, and other half stays carried. Issue answered by ruling in comment
#   has no closing pull request to find; copied label and composed one look alike; pull
#   request green now and about to move shows nothing yet.
#   Issue titled as commit is fact GitHub records and never sat on carried list, so it is
#   ledger read rather than carried line. Pull request title is skipped, since merge commit
#   takes it as subject and so it takes that shape by rule.
#
#   Daily rather than weekly: pull request ready and red for week is failure this exists to
#   catch.
#   One issue, not one per finding: issue per finding trains reader to skim. Marker in body is
#   what makes later run comment on open issue.
#   Bodies only, never comments: role line in comment is written loose, so check over comments
#   would name loose style rather than missing role. Comment half stays carried with first
#   rule.
#   Role line may follow leading HTML comment, since issue that `watch.yml` or this file opens
#   carries its marker first, and marker renders as nothing.
#
#   `permissions` block is whole grant, never addition: scope left out is set to `none`. Ledger
#   reads runs, reads pull requests, writes issues, and names those three and nothing else.
#   Cost: `issues: write`, as `watch.yml` holds. Both run on events no pull request can reach.
#   Cost: runner minutes, about minute per run, daily; free while repository is public.
#   `concurrency` because dispatch can meet schedule; queued run waits rather than cancels.

name: ledger

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  actions: read
  issues: write
  pull-requests: read

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  unchecked:
    runs-on: ubuntu-latest
    steps:
      - name: Read what GitHub records, then open or add to one issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MARKER: '<!-- ledger:unchecked -->'
          SINCE_DAYS: '14'
        run: |
          set -euo pipefail
          found=''

          # Ready and not green. Run still queued or running is not failure yet, and skipping
          #   those is what stops ledger naming every pull request just marked ready.
          open_prs="$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,isDraft,headRefOid,title \
            --jq '.[] | select(.isDraft | not)
                  | "\(.number)\t\(.headRefOid)\t\(.title)"')"
          while IFS=$'\t' read -r number sha title; do
            [ -n "$number" ] || continue
            runs="$(gh api "repos/$REPO/actions/runs?head_sha=$sha&per_page=100" \
              --jq '.workflow_runs[] | select(.name == "check")
                    | .status + ":" + (.conclusion // "none")')"
            case "$runs" in
              *completed:success*) continue ;;
              *queued:*|*in_progress:*) continue ;;
            esac
            found="$found- Pull request #$number is ready with no green run, at "
            found="$found\`${sha:0:7}\` -- $title"$'\n'
          done <<< "$open_prs"

          # `Closes #N` that never fired. Merge into branch other than default closes nothing,
          #   and this repository stacks pull requests, so that is likeliest cause here.
          #   Limit covers window with headroom: list is newest first, and fourteen days held
          #   under hundred merges when last counted with `git log --first-parent --merges`.
          since="$(date -u -d "$SINCE_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)"
          still_open="$(gh issue list --repo "$REPO" --state open --limit 100 \
            --json number --jq '[.[].number] | map(tostring) | join(" ")')"
          linked="$(gh pr list --repo "$REPO" --state merged --limit 200 \
            --json number,mergedAt,baseRefName,closingIssuesReferences \
            --jq '.[] as $pr | $pr.closingIssuesReferences[]?
                  | "\($pr.mergedAt)\t\($pr.number)\t\(.number)\t\($pr.baseRefName)"')"
          while IFS=$'\t' read -r merged_at pr issue base; do
            [ -n "$issue" ] || continue
            [ "$merged_at" \> "$since" ] || continue
            case " $still_open " in
              *" $issue "*) ;;
              *) continue ;;
            esac
            found="$found- Issue #$issue is open though pull request #$pr merged naming it"
            found="$found -- base was \`$base\`"$'\n'
          done <<< "$linked"

          # Role line and label, on bodies. Issue with no label at all is failure that has
          #   happened; mistyped one is left to reader, since composing role string is what
          #   makes second label nobody filters on. Line must go on to name role: unfilled
          #   template opens `**Role:** <!--` and would pass otherwise.
          bare="$(gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,body,labels \
            --jq '.[] | select((.body // "")
                  | test("^\\s*(<!--[^>]*-->\\s*)*"
                    + "\\*{0,2}role:\\*{0,2}\\s*`?(curator|contributor/)"; "i") | not)
                  | "- Issue #\(.number) opens with no role line"')"
          [ -z "$bare" ] || found="$found$bare"$'\n'
          unlabelled="$(gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,labels \
            --jq '.[] | select(.labels | length == 0)
                  | "- Issue #\(.number) carries no label, so no role filter finds it"')"
          [ -z "$unlabelled" ] || found="$found$unlabelled"$'\n'

          # Issue titled as commit. Shape is read rather than type list, since `bug:` is prefix
          #   too, and case is kept, so sentence opening `Rework the camera:` passes. Label and
          #   template already say whose issue is and what kind. Double backticks hold title
          #   whole, since title may carry backtick of its own.
          commit_titled="$(gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,title \
            --jq '.[] | select(.title | test("^[a-z]+(\\([^)]*\\))?!?: "))
                  | "- Issue #\(.number) is titled as commit: `` \(.title) ``"')"
          [ -z "$commit_titled" ] || found="$found$commit_titled"$'\n'
          bare_prs="$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,body \
            --jq '.[] | select((.body // "")
                  | test("^\\s*(<!--[^>]*-->\\s*)*"
                    + "\\*{0,2}role:\\*{0,2}\\s*`?(curator|contributor/)"; "i") | not)
                  | "- Pull request #\(.number) opens with no role line"')"
          [ -z "$bare_prs" ] || found="$found$bare_prs"$'\n'
          unlabelled_prs="$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,labels \
            --jq '.[] | select(.labels | length == 0)
                  | "- Pull request #\(.number) carries no label, so no role filter finds it"')"
          [ -z "$unlabelled_prs" ] || found="$found$unlabelled_prs"$'\n'

          if [ -z "$found" ]; then
            echo "Nothing to report."
            exit 0
          fi
          echo "$found"

          # Paragraphs appended rather than written as heredoc: issue body renders each newline
          #   as line break, so paragraph wrapped to width here would break mid-sentence there.
          said="Opened by \`ledger\` workflow rather than by delegate, so nothing here has been"
          said="$said read or judged yet. Each line is fact GitHub records, not opinion."
          note="Role, label, closing and readiness rules stayed on CONTRIBUTOR.md's carried list:"
          note="$note each has half GitHub does not record, and that half is still carried by"
          note="$note hand. Title rule never sat there. Lines above are only what runner can see."
          next="Close this once every line is answered. Later run comments here rather than"
          next="$next opening second issue."
          # Trailing newline trimmed off list, so paragraph after it is one blank line away
          #   rather than two.
          found="${found%$'\n'}"
          body="$(printf '%s\n\n**Role:** curator\n\n%s\n\n%s\n%s\n\n%s\n\n%s\n' \
            "$MARKER" "$said" "Found:" "$found" "$note" "$next")"

          # Read open issues rather than search: search indexing lags, and duplicate opened
          #   because index was cold is noise this avoids.
          existing="$(gh issue list --repo "$REPO" --label curator --state open \
            --limit 100 --json number,body \
            --jq "[.[] | select(.body | contains(\"$MARKER\")) | .number] | first // empty")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "Commented on issue #$existing."
          else
            opened="$(gh issue create --repo "$REPO" --label curator \
              --title 'Unchecked rules: what the ledger found' --body "$body")"
            echo "Opened $opened."
          fi
