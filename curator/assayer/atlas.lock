  "nimcfg": [
    "# Configure every build of assayer: where knoller sits, which Atlas restores under",
    "#   `dependencies/` from `atlas.lock`, and git never keeps (Article XI.3).",
    "#   Knoller is folder `curator/knoller` of repository Atlas clones whole, and Atlas 0.14.7 joins",
    "#     `srcDir` to root of clone, so path below names that folder.",
    "#   Cost: Atlas writes path lacking that folder into its section, at each install and restore,",
    "#     and that path reaches nothing.",
    "",
    "--path:\"dependencies/knoller/curator/knoller/src\"",
    "",
    "############# begin Atlas config section ##########",
    "--noNimblePath",
    "--path:\"dependencies/knoller/src\"",
    "############# end Atlas config section   ##########",
    ""
  ],
  "nimbleFile": {
    "filename": "assayer.nimble",
    "content": [
      "# Package description read by Atlas and nimble; requirements live here (Article II.8).",
      "#   Knoller serves compiler of each pin (`compilers.nim`, `pins.nim`), so it is package here, at",
